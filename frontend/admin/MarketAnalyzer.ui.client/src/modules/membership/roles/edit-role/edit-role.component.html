<form class="dialog-warpper voucher-form" [formGroup]="formGroup" (ngSubmit)="submit()">
  <div class="dialog-header">
    <div class="dialog-title">ویرایش نقش</div>

    <div class="btn-close" (click)="close()">
      <i class="pa-close"></i>
    </div>
  </div>

  <div class="dialog-body d-flex flex-column gap-4 p-4">

    <div>
      <fd-float-label placeholder="نام">
        <input type="text" class="form-control" formControlName="name" />
      </fd-float-label>
      <span class="input-error-text" errorFor="name"></span>
    </div>

    <div>
      <fd-float-label placeholder="نام نمایشی">
        <input type="text" class="form-control" formControlName="displayName" />
      </fd-float-label>
      <span class="input-error-text" errorFor="displayName"></span>
    </div>

    <div class="form-control">
      <checkbox label="فعال" formControlName="isActive"></checkbox>
    </div>
  </div>

  <div class="dialog-footer">
    <div class="d-inline-flex gap-2">
      <button type="submit" class="btn btn-primary">ذخیره</button>
      <button type="button" class="btn btn-dark" (click)="reset()">بازنشانی</button>
    </div>
  </div>
</form>
