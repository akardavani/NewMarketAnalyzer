<fd-page-wrapper [showSidebar]="showSidebar">
  <div toolbar class="d-flex gap-1">
    <div>
      <button type="button" class="btn" (click)="toggleSidebar()">
        <i class="pa pa-filter"></i>
      </button>

      <button type="button" class="btn btn-primary" (click)="createStatute()">
        ایجاد اساسنامه
      </button>
    </div>
  </div>

  <form
    [formGroup]="filter"
    sidebar
    class="ag-filter-form"
    (ngSubmit)="applyFilter()"
  >
    <fd-scrollbar>
      <fd-float-label class="form-field" placeholder="از تاریخ">
        <date-input formControlName="fromDate" />
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="تا تاریخ">
        <date-input formControlName="toDate" />
      </fd-float-label>
    </fd-scrollbar>

    <footer>
      <button type="submit" class="btn btn-primary btn-search">جستجو</button>
      <button type="button" class="btn btn-dark" (click)="resetFilter()">
        بازنشانی
      </button>
    </footer>
  </form>
  <ag-grid-angular
    [enableRtl]="true"
    [getRowId]="getRowId"
    [style.width]="width"
    [style.height]="height"
    [localeText]="localeText"
    [rowModelType]="rowModelType"
    [autoSizeStrategy]="autoSizeStrategy"
    [loadingOverlayComponent]="loadingOverlayComponent"
    [paginationPageSizeSelector]="paginationPageSizeSelector"
    (gridReady)="onGridReady($event)"
  >
  </ag-grid-angular>
</fd-page-wrapper>
