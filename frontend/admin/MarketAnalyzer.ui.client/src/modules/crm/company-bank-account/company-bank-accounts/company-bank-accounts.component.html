<fd-page-wrapper [showSidebar]="showSidebar">
  <div toolbar class="d-flex">
    <button type="button" class="btn" (click)="toggleSidebar()"><i class="pa-filter"></i></button>

    <div>
      <button type="button" class="btn btn-primary" (click)="create()">ایجاد حساب بانکی</button>
    </div>
  </div>

  <form [formGroup]="filter" sidebar class="ag-filter-form" (ngSubmit)="applyFilter()">
    <fd-scrollbar>

      <div class="form-field">
        <fd-float-label placeholder="شماره حساب">
          <input type="text" class="form-control" formControlName="accountNumber" />
        </fd-float-label>
      </div>

      <fd-float-label class="form-field" placeholder="شماره شبا">
        <input type="text" class="form-control" formControlName="shebaNumber" />
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="بانک">
        <fd-drop-down formControlName="bankId">
          <fd-option [value]="null">همه</fd-option>
          @for(item of (banks | async); track $index) {
          <fd-option [value]="item.value">{{item.text}}</fd-option>
          }
        </fd-drop-down>
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="نوع حساب">
        <fd-drop-down formControlName="accountTypeId">
          <fd-option [value]="null">همه</fd-option>
          @for(item of (bankAccountTypes | async); track $index) {
          <fd-option [value]="item.value">{{item.text}}</fd-option>
          }
        </fd-drop-down>
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="وضعیت">
        <fd-drop-down formControlName="stateId">
          <fd-option [value]="null">همه</fd-option>
          @for(item of (confirmationStates | async); track $index) {
          <fd-option [value]="item.value">{{item.text}}</fd-option>
          }
        </fd-drop-down>
      </fd-float-label>

    </fd-scrollbar>

    <footer>
      <button type="submit" class="btn btn-primary btn-search">جستجو</button>
      <button type="button" class="btn btn-dark" (click)="resetFilter()">بازنشانی</button>
    </footer>
  </form>

  <ag-grid-angular [enableRtl]="true"
                   [getRowId]="getRowId"
                   [style.width]="width"
                   [style.height]="height"
                   [localeText]="localeText"
                   [rowModelType]="rowModelType"
                   [autoSizeStrategy]="autoSizeStrategy"
                   [loadingOverlayComponent]="loadingOverlayComponent"
                   [paginationPageSizeSelector]="paginationPageSizeSelector"
                   (gridReady)="onGridReady($event)">
  </ag-grid-angular>

</fd-page-wrapper>
