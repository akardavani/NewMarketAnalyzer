<fd-page-wrapper [showSidebar]="showSidebar">
  <div toolbar class="d-flex">
    <button type="button" class="btn" (click)="toggleSidebar()"><i class="pa-filter"></i></button>

    <div>
      <button type="button" class="btn btn-primary btn-submit" (click)="createInvestor()">ثبت اشخاص</button>
    </div>
  </div>

  <form [formGroup]="filter" sidebar class="ag-filter-form" (ngSubmit)="applyFilter()">
    <fd-scrollbar>

      <fd-float-label class="form-field" placeholder="نام">
        <input type="text" class="form-control" formControlName="name" />
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="کد ملی">
        <input type="text" class="form-control" formControlName="nationalCode" />
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="نوع شخص">
        <fd-drop-down formControlName="personTypeId">
          <fd-option [value]="null">همه</fd-option>
          @for(item of personTypes; track $index) {
          <fd-option [value]="item.value">{{item.text}}</fd-option>
          }
        </fd-drop-down>
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="شماره ثبت/شماره شناسنامه">
        <input type="text" class="form-control" formControlName="identityNumber" />
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="شماره موبایل">
        <input type="text" class="form-control" formControlName="phoneNumber" />
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="تاریخ ثبت از">
        <date-input formControlName="creationDateFrom" />
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="تاریخ ثبت تا">
        <date-input formControlName="creationDateTo" />
      </fd-float-label>

      <div class="form-field">
        <div class="form-control">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="sejamAuthenticated" formControlName="sejamAuthenticated">
            <label class="form-check-label" for="sejamAuthenticated">سجامی</label>
          </div>
        </div>
      </div>

    </fd-scrollbar>

    <footer>
      <button type="submit" class="btn btn-primary btn-search">جستجو</button>
      <button type="button" class="btn btn-dark" (click)="resetFilter()">بازنشانی</button>
    </footer>
  </form>

  <ag-grid-angular [enableRtl]="true"
                   [getRowId]="getRowId"
                   [style.width]="width"
                   [style.height]="height"
                   [localeText]="localeText"
                   [rowModelType]="rowModelType"
                   [autoSizeStrategy]="autoSizeStrategy"
                   [loadingOverlayComponent]="loadingOverlayComponent"
                   [paginationPageSizeSelector]="paginationPageSizeSelector"
                   (gridReady)="onGridReady($event)">
  </ag-grid-angular>

</fd-page-wrapper>
