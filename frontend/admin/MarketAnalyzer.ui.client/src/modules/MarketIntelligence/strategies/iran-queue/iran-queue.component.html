<div class="page">
  <h4>صف خرید (IranQueue)</h4>
  <div class="card-box">
    <div class="grid">
      <div class="field wide">
        <label>مسیر فایل اکسل *</label>
        <input type="text" dir="ltr" [(ngModel)]="inputFilePath" />
        <small class="hint">مسیر کامل فایل روی سرور</small>
      </div>
      <div class="field"><label>از نسبت *</label><input type="number" dir="ltr" [(ngModel)]="fromRatio" /></div>
      <div class="field"><label>تا نسبت *</label><input type="number" dir="ltr" [(ngModel)]="toRatio" /></div>
      <div class="field"><label>بازدهی یک ماهه (کمتر از) *</label><input type="number" dir="ltr" [(ngModel)]="return1Month" /></div>
    </div>
    <button type="button" class="btn-run" [disabled]="running()" (click)="run()">
      @if (running()) { در حال اجرا... } @else { اجرا }
    </button>
  </div>

  @if (errors().length) {
    <div class="alert">@for (e of errors(); track $index) { <div>{{ e }}</div> }</div>
  }

  @if (data(); as d) {
    <mi-data-table title="نتایج صف خرید" [rows]="d.queueResult" [columns]="cols" />
  }
  @if (data() && isEmpty()) { <div class="card-box">نتیجه‌ای برای نمایش وجود ندارد{{ status() ? ' (' + status() + ')' : '' }}.</div> }
</div>
