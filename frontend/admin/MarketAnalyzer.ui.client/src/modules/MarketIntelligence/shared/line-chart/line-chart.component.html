@if (model; as c) {
  <div class="card-box">
    <h6>{{ title }}</h6>
    <div class="chart-wrap"><svg [attr.viewBox]="'0 0 ' + W + ' ' + H" class="chart" dir="ltr" style="overflow: visible">
      <line [attr.x1]="padL" [attr.y1]="H - padB" [attr.x2]="W - padR" [attr.y2]="H - padB" stroke="#999" />
      <line [attr.x1]="padL" [attr.y1]="padT" [attr.x2]="padL" [attr.y2]="H - padB" stroke="#999" />
      <text [attr.x]="padL - 8" [attr.y]="padT + 4" class="axis" text-anchor="end">{{ c.yMax.toFixed(2) }}</text>
      <text [attr.x]="padL - 8" [attr.y]="H - padB" class="axis" text-anchor="end">{{ c.yMin.toFixed(2) }}</text>
      <text [attr.x]="padL" [attr.y]="H - 20" class="axis" text-anchor="start">{{ c.xLabels[0] }}</text>
      <text [attr.x]="W / 2" [attr.y]="H - 20" class="axis" text-anchor="middle">{{ c.xLabels[1] }}</text>
      <text [attr.x]="W - padR" [attr.y]="H - 20" class="axis" text-anchor="end">{{ c.xLabels[2] }}</text>
      @for (s of c.items; track s.label) {
        <polyline [attr.points]="s.points" fill="none" [attr.stroke]="s.color" stroke-width="2" />
      }
    </svg></div>
    <div class="legend">
      @for (s of c.items; track s.label) { <span><i [style.background]="s.color"></i>{{ s.label }}</span> }
    </div>
  </div>
}
