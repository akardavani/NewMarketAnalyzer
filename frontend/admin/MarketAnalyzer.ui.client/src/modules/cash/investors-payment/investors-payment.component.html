<fd-page-wrapper [showSidebar]="showSidebar">
  <div toolbar class="d-flex">
    <button type="button" class="btn" (click)="toggleSidebar()"><i class="pa-filter"></i></button>

    <div class="d-flex gap-2">
      <button class="btn btn-primary btn-submit" [disabled]="disableCreatePayment" (click)="createPaymentOrder()">ثبت دستور پرداخت</button>
    </div>
  </div>

  <form [formGroup]="filter" sidebar class="ag-filter-form" (ngSubmit)="applyFilter()">
    <fd-scrollbar>

      <div class="form-field">
        <fd-float-label placeholder="نوع حساب">
          <fd-drop-down formControlName="reasonId">
            <fd-option [value]="null">[نوع حساب]</fd-option>
            @for(item of reasons | async; track $index) {
            <fd-option [value]="item.value">{{item.text}}</fd-option>
            }
          </fd-drop-down>
        </fd-float-label>
        <span class="input-error-text" errorFor="reasonId"></span>
      </div>

      <div class="form-field">
        <fd-float-label placeholder="نوع شخصیت">
          <fd-drop-down formControlName="personTypeId">
            <fd-option [value]="null">[نوع شخصیت]</fd-option>
            @for(item of personTypes; track $index) {
            <fd-option [value]="item.value">{{item.text}}</fd-option>
            }
          </fd-drop-down>
        </fd-float-label>
        <span class="input-error-text" errorFor="personTypeId"></span>
      </div>

      <div class="form-field">
        <fd-float-label placeholder="بانک سرمایه گذار">
          <fd-drop-down formControlName="bankId">
            <fd-option [value]="null">[بانک سرمایه گذار]</fd-option>
            @for(item of banks | async; track $index) {
            <fd-option [value]="item.value">{{item.text}}</fd-option>
            }
          </fd-drop-down>
        </fd-float-label>
        <span class="input-error-text" errorFor="bankId"></span>
      </div>

      <div class="form-field">
        <fd-float-label placeholder="سرمایه گذار">
          <input type="text" class="form-control" formControlName="investor" />
        </fd-float-label>
        <span class="input-error-text" errorFor="investor"></span>
      </div>

      <div class="form-field">
        <fd-float-label placeholder="تا تاریخ">
          <date-input formControlName="toDate"></date-input>
        </fd-float-label>
        <span class="input-error-text" errorFor="toDate"></span>
      </div>

    </fd-scrollbar>

    <footer>
      <button type="submit" class="btn btn-primary btn-search">جستجو</button>
      <button type="button" class="btn btn-dark" (click)="resetFilter()">بازنشانی</button>
    </footer>
  </form>

  <ag-grid-angular [enableRtl]="true"
                   [rowData]="data | async"
                   [getRowId]="getRowId"
                   [style.width]="width"
                   [style.height]="height"
                   [localeText]="localeText"
                   [rowModelType]="rowModelType"
                   [autoSizeStrategy]="autoSizeStrategy"
                   [loadingOverlayComponent]="loadingOverlayComponent"
                   [paginationPageSizeSelector]="paginationPageSizeSelector"
                   (gridReady)="onGridReady($event)">
  </ag-grid-angular>

</fd-page-wrapper>
