<fd-page-wrapper [showSidebar]="showSidebar">
  <div toolbar class="d-flex gap-2">
    <div>
      <button type="button" class="btn" (click)="toggleSidebar()"><i class="pa-filter"></i></button>
    </div>

    <div class="d-flex align-items-center gap-1">
      <button type="button" class="btn btn-primary" (click)="receiveBankInterest()">دریافت سود بانک</button>
    </div>
  </div>

  <form [formGroup]="filter" sidebar class="ag-filter-form" (ngSubmit)="applyFilter()">
    <fd-scrollbar>

      <fd-float-label class="form-field" placeholder="از تاریخ">
        <date-input formControlName="fromDate"></date-input>
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="تا تاریخ">
        <date-input formControlName="toDate"></date-input>
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="مبلغ">
        <input type="text" class="form-control" formControlName="amount" />
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="شناسه سند">
        <input type="text" class="form-control" formControlName="vocherId" />
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="سپرده">
        <fd-drop-down formControlName="sourceBankId">
          <fd-option [value]="null">همه</fd-option>
          @for(item of originBanks | async; track $index) {
          <fd-option [value]="item.value">{{item.text}}</fd-option>
          }
        </fd-drop-down>
      </fd-float-label>

      <div class="form-field">
        <div class="d-flex form-control">
          <checkbox label="دریافت سود بصورت تدریجی" formControlName="profitsGraduallyReceive"></checkbox>
        </div>
      </div>

    </fd-scrollbar>

    <footer>
      <button type="submit" class="btn btn-primary btn-search">جستجو</button>
      <button type="button" class="btn btn-dark" (click)="resetFilter()">بازنشانی</button>
    </footer>
  </form>

  <ag-grid-angular [enableRtl]="true"
                   [getRowId]="getRowId"
                   [style.width]="width"
                   [style.height]="height"
                   [localeText]="localeText"
                   [rowModelType]="rowModelType"
                   [autoSizeStrategy]="autoSizeStrategy"
                   [loadingOverlayComponent]="loadingOverlayComponent"
                   [paginationPageSizeSelector]="paginationPageSizeSelector"
                   (gridReady)="onGridReady($event)">
  </ag-grid-angular>

</fd-page-wrapper>
