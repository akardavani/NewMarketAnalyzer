<fd-page-wrapper [showSidebar]="showSidebar">
  <div toolbar class="d-inline-flex align-items-center justify-content-center gap-2 pe-2">
    <button type="button" class="btn" (click)="toggleSidebar()"><i class="pa-filter"></i></button>
    <button type="button" class="btn" (click)="exportReport(1)"><i class="pa pa-pdf"></i></button>
    <button type="button" class="btn" (click)="exportReport(2)"><i class="pa pa-excel"></i></button>
  </div>

  <form [formGroup]="filter" sidebar class="ag-filter-form" (ngSubmit)="applyFilter()">
    <fd-scrollbar>

      <fd-float-label class="form-field" placeholder="سال مالی">
        <fd-drop-down [formControl]="fiscalYear">
          @for(item of fiscalYears; track $index) {
          <fd-option [value]="item">{{item.text}}</fd-option>
          }
        </fd-drop-down>
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="سطح حساب">
        <fd-drop-down formControlName="accountLevel">
          @for(item of accountLevels; track $index) {
          <fd-option [value]="item.value">{{item.text}}</fd-option>
          }
        </fd-drop-down>
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="نوع گزارش">
        <fd-drop-down formControlName="queryType">
          @for(item of queryTypes; track $index) {
          <fd-option [value]="item.value">{{item.text}}</fd-option>
          }
        </fd-drop-down>
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="حساب">
        <fd-autocomplete [dataSource]="accountsSource" formControlName="accountCode"></fd-autocomplete>
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="از تاریخ">
        <date-input formControlName="fromDate" />
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="تا تاریخ">
        <date-input formControlName="toDate" />
      </fd-float-label>
      <div class="form-field">
        <div class="d-flex form-control">
          <checkbox label="بدون سند افتتاحیه" formControlName="excludeOpeningVoucher"></checkbox>
        </div>
      </div>

      <div class="form-field">
        <div class="d-flex form-control">
          <checkbox label="بدون سند اختتامیه" formControlName="excludeClosingVoucher"></checkbox>
        </div>
      </div>

      <div class="form-field">
        <div class="d-flex form-control">
          <checkbox label="بدون سند بستن حساب‌های موقت" formControlName="excludeCloseTemporaryAccountsVoucher"></checkbox>
        </div>
      </div>

      <div class="form-field">
        <div class="d-flex form-control">
          <checkbox label="بدون سند بستن حساب‌های عملکرد" formControlName="excludeCloseOperatingAccounts"></checkbox>
        </div>
      </div>
    </fd-scrollbar>

    <footer>
      <button type="submit" class="btn btn-primary btn-search">جستجو</button>
      <button type="button" class="btn btn-dark" (click)="resetFilter()">بازنشانی</button>
    </footer>
  </form>

  <ag-grid-angular [enableRtl]="true"
                   [getRowId]="getRowId"
                   [style.width]="width"
                   [style.height]="height"
                   [localeText]="localeText"
                   [rowModelType]="rowModelType"
                   [pinnedBottomRowData]="totalRowData"
                   [autoSizeStrategy]="autoSizeStrategy"
                   [loadingOverlayComponent]="loadingOverlayComponent"
                   [paginationPageSizeSelector]="paginationPageSizeSelector"
                   (gridReady)="onGridReady($event)"
                   (paginationChanged)="onPaginationChanged($event)">
  </ag-grid-angular>

</fd-page-wrapper>
