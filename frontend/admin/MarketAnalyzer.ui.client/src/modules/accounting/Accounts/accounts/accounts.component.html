<fd-page-wrapper [showSidebar]="showSidebar">
  <div toolbar class="d-flex gap-2">
    <div>
      <button type="button" class="btn" (click)="toggleSidebar()"><i class="pa pa-filter"></i></button>
      <button type="button" class="btn" (click)="exportReport(1)"><i class="pa pa-pdf"></i></button>
      <button type="button" class="btn" (click)="exportReport(2)"><i class="pa pa-excel"></i></button>
    </div>

    <div class="d-flex gap-1">
      <button type="button" class="btn btn-success" (click)="showTree()">نمای درختی حساب‌ها</button>
      <button type="button" class="btn btn-primary" (click)="create()">ایجاد حساب</button>
    </div>
  </div>

  <form [formGroup]="filter" sidebar class="ag-filter-form" (ngSubmit)="applyFilter()">
    <fd-scrollbar>

      <fd-float-label class="form-field" placeholder="کد حساب">
        <input type="text" class="form-control" formControlName="code" />
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="عنوان حساب">
        <input type="text" class="form-control" formControlName="title" />
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="سطح حساب">
        <fd-drop-down formControlName="level">
          <fd-option [value]="null">همه</fd-option>
          @for(item of accountLevels; track $index) {
          <fd-option [value]="item.value">{{item.text}}</fd-option>
          }
        </fd-drop-down>
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="ماهیت حساب">
        <fd-drop-down formControlName="nature">
          <fd-option [value]="null">همه</fd-option>
          @for(item of accountNatures; track $index) {
          <fd-option [value]="item.value">{{item.text}}</fd-option>
          }
        </fd-drop-down>
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="نوع حساب">
        <fd-drop-down formControlName="type">
          <fd-option [value]="null">همه</fd-option>
          @for(item of accountTypes; track $index) {
          <fd-option [value]="item.value">{{item.text}}</fd-option>
          }
        </fd-drop-down>
      </fd-float-label>

    </fd-scrollbar>

    <footer>
      <button type="submit" class="btn btn-primary btn-search">جستجو</button>
      <button type="button" class="btn btn-dark" (click)="resetFilter()">بازنشانی</button>
    </footer>
  </form>

  <ag-grid-angular [enableRtl]="true"
                   [getRowId]="getRowId"
                   [style.width]="width"
                   [style.height]="height"
                   [localeText]="localeText"
                   [rowModelType]="rowModelType"
                   [autoSizeStrategy]="autoSizeStrategy"
                   [loadingOverlayComponent]="loadingOverlayComponent"
                   [paginationPageSizeSelector]="paginationPageSizeSelector"
                   (gridReady)="onGridReady($event)">
  </ag-grid-angular>

</fd-page-wrapper>
