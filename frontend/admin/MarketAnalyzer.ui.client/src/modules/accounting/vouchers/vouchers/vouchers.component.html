<fd-page-wrapper [showSidebar]="showSidebar">
  <div toolbar class="d-inline-flex align-items-center justify-content-center gap-2 pe-2">
    <button type="button" class="btn" (click)="toggleSidebar()"><i class="pa-filter"></i></button>
    <button type="button" class="btn" (click)="create()"><i class="pa-add"></i></button>
    <button type="button" class="btn" (click)="exportReport(1)"><i class="pa-pdf"></i></button>
    <button type="button" class="btn" (click)="exportReport(2)"><i class="pa-excel"></i></button>
  </div>

  <form [formGroup]="filter" sidebar class="ag-filter-form" (ngSubmit)="applyFilter()">
    <fd-scrollbar>

      <fd-float-label class="form-field" placeholder="سال مالی">
        <fd-drop-down [formControl]="fiscalYear">
          @for(item of fiscalYears; track $index) {
          <fd-option [value]="item">{{item.text}}</fd-option>
          }
        </fd-drop-down>
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="از تاریخ">
        <date-input formControlName="fromDate" />
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="تا تاریخ">
        <date-input formControlName="toDate" />
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="از شماره سند">
        <input type="text" class="form-control" formControlName="fromNumber" />
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="تا شماره سند">
        <input type="text" class="form-control" formControlName="toNumber" />
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="از شماره عطف">
        <input type="text" class="form-control" formControlName="fromReferenceNumber" />
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="تا شماره عطف">
        <input type="text" class="form-control" formControlName="toReferenceNumber" />
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="از شماره روزانه">
        <input type="text" class="form-control" formControlName="fromDailyNumber" />
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="تا شماره روزانه">
        <input type="text" class="form-control" formControlName="toDailyNumber" />
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="از شماره فرعی">
        <input type="text" class="form-control" formControlName="fromSecondaryNumber" />
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="تا شماره فرعی">
        <input type="text" class="form-control" formControlName="toSecondaryNumber" />
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="شرح">
        <input type="text" class="form-control" formControlName="description" />
      </fd-float-label>

      <div class="form-field">
        <div class="d-flex form-control">
          <checkbox label="سهام قفل شده" formControlName="isLocked"></checkbox>
        </div>
      </div>

      <div class="form-field">
        <fd-float-label placeholder="نوع سند">
          <checkbox-group class="form-control d-inline-flex flex-column gap-3" style="max-height:200px; overflow-y:auto;" formControlName="voucherTypes">
            @for(item of voucherTypes | async; track $index) {
            <checkbox [label]="item.text" [value]="item.value"></checkbox>
            }
          </checkbox-group>
        </fd-float-label>
      </div>

      <div class="form-field">
        <fd-float-label placeholder="وضعیت سند">
          <checkbox-group class="form-control d-inline-flex flex-column gap-3" style="max-height:200px; overflow-y:auto;" formControlName="voucherStates">
            @for(item of voucherStates | async; track $index) {
            <checkbox [label]="item.text" [value]="item.value"></checkbox>
            }
          </checkbox-group>
        </fd-float-label>
      </div>

      <div class="form-field">
        <fd-float-label placeholder="نحوه ثبت سند">
          <checkbox-group class="form-control d-inline-flex flex-column gap-3" style="max-height:200px; overflow-y:auto;" formControlName="creationTypes">
            @for(item of creationTypes | async; track $index) {
            <checkbox [label]="item.text" [value]="item.value"></checkbox>
            }
          </checkbox-group>
        </fd-float-label>
      </div>

    </fd-scrollbar>

    <footer>
      <button type="submit" class="btn btn-primary btn-search">جستجو</button>
      <button type="button" class="btn btn-dark" (click)="resetFilter()">بازنشانی</button>
    </footer>
  </form>

  <ag-grid-angular [enableRtl]="true"
                   [getRowId]="getRowId"
                   [style.width]="width"
                   [style.height]="height"
                   [localeText]="localeText"
                   [rowModelType]="rowModelType"
                   [autoSizeStrategy]="autoSizeStrategy"
                   [loadingOverlayComponent]="loadingOverlayComponent"
                   [paginationPageSizeSelector]="paginationPageSizeSelector"
                   (gridReady)="onGridReady($event)">
  </ag-grid-angular>

</fd-page-wrapper>
