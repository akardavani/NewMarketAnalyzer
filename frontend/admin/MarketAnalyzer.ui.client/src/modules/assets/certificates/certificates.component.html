<fd-page-wrapper [showSidebar]="showSidebar">
  <div toolbar class="d-flex gap-4">
    <div>
      <button type="button" class="btn" (click)="toggleSidebar()"><i class="pa-filter"></i></button>
    </div>
  </div>

  <form [formGroup]="filter" sidebar class="ag-filter-form" (ngSubmit)="applyFilter()">
    <fd-scrollbar>

      <div class="form-field">
        <fd-float-label class="form-field" placeholder="نوع گواهی">
          <fd-drop-down formControlName="assetUnitTypeId">
            <fd-option [value]="null">همه</fd-option>
            @for(item of (assetUnitTypes | async); track $index) {
            <fd-option [value]="item.value">{{item.text}}</fd-option>
            }
          </fd-drop-down>
        </fd-float-label>
      </div>

      <div class="form-field">
        <fd-float-label class="form-field" placeholder="نوع سرمایه گذار">
          <fd-drop-down formControlName="investorTypeId">
            <fd-option [value]="null">همه</fd-option>
            @for(item of personTypes; track $index) {
            <fd-option [value]="item.value">{{item.text}}</fd-option>
            }
          </fd-drop-down>
        </fd-float-label>
      </div>

      <div class="form-field">
        <fd-float-label placeholder="تا تاریخ">
          <date-input formControlName="toDate"></date-input>
        </fd-float-label>
      </div>

      <div class="form-field">
        <fd-float-label placeholder="تعداد از">
          <input type="text" class="form-control" formControlName="fromQuantity" [ngAutoNumeric]="{}" />
        </fd-float-label>
      </div>

      <div class="form-field">
        <fd-float-label placeholder="تعداد تا">
          <input type="text" class="form-control" formControlName="toQuantity" [ngAutoNumeric]="{}" />
        </fd-float-label>
      </div>

      <div class="form-field">
        <fd-float-label placeholder="سرمایه گذار">
          <fd-autocomplete [dataSource]="investorSources" formControlName="investorId"></fd-autocomplete>
        </fd-float-label>
      </div>
    </fd-scrollbar>

    <footer>
      <button type="submit" class="btn btn-primary btn-search">جستجو</button>
      <button type="button" class="btn btn-dark" (click)="resetFilter()">بازنشانی</button>
    </footer>
  </form>

  <ag-grid-angular [enableRtl]="true"
                   [getRowId]="getRowId"
                   [style.width]="width"
                   [style.height]="height"
                   [localeText]="localeText"
                   [rowModelType]="rowModelType"
                   [autoSizeStrategy]="autoSizeStrategy"
                   [loadingOverlayComponent]="loadingOverlayComponent"
                   [paginationPageSizeSelector]="paginationPageSizeSelector"
                   (gridReady)="onGridReady($event)">
  </ag-grid-angular>

</fd-page-wrapper>
