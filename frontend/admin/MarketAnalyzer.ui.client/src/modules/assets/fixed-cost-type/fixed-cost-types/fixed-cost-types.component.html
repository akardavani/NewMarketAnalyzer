<fd-page-wrapper [showSidebar]="showSidebar">
  <div toolbar class="d-flex gap-4">
    <div>
      <button type="button" class="btn" (click)="toggleSidebar()"><i class="pa-filter"></i></button>
      <button type="button" class="btn" (click)="exportReport(1)"><i class="pa pa-pdf"></i></button>
      <button type="button" class="btn" (click)="exportReport(2)"><i class="pa pa-excel"></i></button>

      <button type="button" class="btn btn-primary" (click)="create()">ایجاد نوع هزینه ثابت</button>
    </div>
  </div>

  <form [formGroup]="filter" sidebar class="ag-filter-form" (ngSubmit)="applyFilter()">
    <fd-scrollbar>
      <div class="form-field">
        <fd-float-label placeholder="نام هزینه">
          <input type="text" class="form-control" formControlName="name" />
        </fd-float-label>
      </div>
    </fd-scrollbar>

    <footer>
      <button type="submit" class="btn btn-primary btn-search">جستجو</button>
      <button type="button" class="btn btn-dark" (click)="resetFilter()">بازنشانی</button>
    </footer>
  </form>

  <ag-grid-angular [enableRtl]="true"
                   [getRowId]="getRowId"
                   [style.width]="width"
                   [style.height]="height"
                   [localeText]="localeText"
                   [rowModelType]="rowModelType"
                   [autoSizeStrategy]="autoSizeStrategy"
                   [loadingOverlayComponent]="loadingOverlayComponent"
                   [paginationPageSizeSelector]="paginationPageSizeSelector"
                   (gridReady)="onGridReady($event)">
  </ag-grid-angular>

</fd-page-wrapper>
