<fd-page-wrapper [showSidebar]="showSidebar">
  <div toolbar class="d-flex gap-1">
    <div>
      <button type="button" class="btn" (click)="toggleSidebar()"><i class="pa pa-filter"></i></button>
      <button type="button" class="btn" (click)="exportReport(1)"><i class="pa pa-pdf"></i></button>
      <button type="button" class="btn" (click)="exportReport(2)"><i class="pa pa-excel"></i></button>
    </div>

    <div class="d-flex gap-1">
      <button type="button" class="btn btn-success" [disabled]="!selectedRows.length" (click)="confirmRequests()" title="تایید درخواست‌های انتخاب شده">
        <i class="pa pa-accept"></i>
      </button>
      <button type="button" class="btn btn-warning" [disabled]="!selectedRows.length" (click)="rejectRequests()" title="رد درخواست‌های انتخاب شده">
        <i class="pa pa-cancel"></i>
      </button>
      <button type="button" class="btn btn-danger" [disabled]="!selectedRows.length" (click)="deleteRequests()" title="حذف درخواست‌های انتخاب شده">
        <i class="pa pa-trash"></i>
      </button>
      <button type="button" class="btn btn-dark" [disabled]="!changed.length" (click)="saveChanges()" title="ذخیره تغییرات">
        <i class="pa pa-save"></i>
      </button>

      <button type="button" class="btn btn-primary btn-submit" (click)="requestIssuance()">ثبت درخواست صدور</button>
      <button type="button" class="btn btn-primary btn-submit" (click)="requestCancellation()">ثبت درخواست ابطال</button>
      <button type="button" class="btn btn-primary btn-submit" (click)="requestIssuanceSuperUnit()">ثبت گواهی ممتاز</button>
      <button type="button" class="btn btn-primary" (click)="requestTransferSuperUnit()">انتقال گواهی ممتاز</button>
    </div>
  </div>

  <form [formGroup]="filter" sidebar class="ag-filter-form" (ngSubmit)="applyFilter()">
    <fd-scrollbar>

      <div class="form-field">
        <fd-float-label placeholder="سرمایه‌گذار">
          <fd-autocomplete [dataSource]="investorSources" formControlName="investorId"></fd-autocomplete>
        </fd-float-label>
      </div>

      <fd-float-label class="form-field" placeholder="از تاریخ ثبت">
        <date-input formControlName="fromRequestDate" />
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="تا تاریخ ثبت">
        <date-input formControlName="toRequestDate" />
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="از تاریخ NAV مبنا">
        <date-input formControlName="fromBaseNavDate" />
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="تا تاریخ NAV مبنا">
        <date-input formControlName="toBaseNavDate" />
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="نوع درخواست">
        <fd-drop-down formControlName="requestTypeId">
          <fd-option [value]="null">همه</fd-option>
          @for(item of requestTypes | async; track $index) {
          <fd-option [value]="item.value">{{item.text}}</fd-option>
          }
        </fd-drop-down>
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="وضعیت درخواست">
        <fd-drop-down formControlName="stateId">
          <fd-option [value]="null">همه</fd-option>
          @for(item of requestStates | async; track $index) {
          <fd-option [value]="item.value">{{item.text}}</fd-option>
          }
        </fd-drop-down>
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="نوع واحد">
        <fd-drop-down formControlName="unitTypeId">
          <fd-option [value]="null">همه</fd-option>
          @for(item of unitTypes | async; track $index) {
          <fd-option [value]="item.value">{{item.text}}</fd-option>
          }
        </fd-drop-down>
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="شیوه واریز">
        <fd-drop-down formControlName="paymentMethodId">
          <fd-option [value]="null">همه</fd-option>
          @for(item of paymentMethods; track $index) {
          <fd-option [value]="item.value">{{item.text}}</fd-option>
          }
        </fd-drop-down>
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="از تعداد">
        <input type="text" class="form-control" formControlName="fromQuantity" />
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="تا تعداد">
        <input type="text" class="form-control" formControlName="toQuantity" />
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="از مبلغ">
        <input type="text" class="form-control" formControlName="fromAmount" />
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="تا مبلغ">
        <input type="text" class="form-control" formControlName="toAmount" />
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="شماره سریال فرم صدور">
        <input type="text" class="form-control" formControlName="formSerialNumber" />
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="شماره فیش واریزی">
        <input type="text" class="form-control" formControlName="depositSlipNumber" />
      </fd-float-label>

    </fd-scrollbar>

    <footer>
      <button type="submit" class="btn btn-primary btn-search">جستجو</button>
      <button type="button" class="btn btn-dark" (click)="resetFilter()">بازنشانی</button>
    </footer>
  </form>

  <ag-grid-angular [enableRtl]="true"
                   [getRowId]="getRowId"
                   [style.width]="width"
                   [style.height]="height"
                   [localeText]="localeText"
                   [rowModelType]="rowModelType"
                   [autoSizeStrategy]="autoSizeStrategy"
                   [loadingOverlayComponent]="loadingOverlayComponent"
                   [paginationPageSizeSelector]="paginationPageSizeSelector"
                   (gridReady)="onGridReady($event)">
  </ag-grid-angular>

</fd-page-wrapper>
