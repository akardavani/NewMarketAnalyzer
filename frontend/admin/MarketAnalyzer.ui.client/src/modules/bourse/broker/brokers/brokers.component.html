<fd-page-wrapper [showSidebar]="showSidebar">
  <div toolbar>
    <button type="button" class="btn" (click)="toggleSidebar()"><i class="pa-filter"></i></button>
  </div>

  <form [formGroup]="filter" sidebar class="ag-filter-form" (ngSubmit)="applyFilter()">
    <fd-scrollbar>

      <fd-float-label class="form-field" placeholder="نام کارگزاری">
        <input type="text" class="form-control" formControlName="name" />
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="کد کارگزاری">
        <input type="text" class="form-control" formControlName="nscCode" />
      </fd-float-label>

      <fd-float-label class="form-field" placeholder="کد معاملاتی کارگزاری">
        <input type="text" class="form-control" formControlName="tradeCode" />
      </fd-float-label>

      <div class="form-field">
        <div class="form-control">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="isActive" formControlName="isActive">
            <label class="form-check-label" for="isActive">فعال</label>
          </div>
        </div>
      </div>

    </fd-scrollbar>

    <footer>
      <button type="submit" class="btn btn-primary btn-search">جستجو</button>
      <button type="button" class="btn btn-dark" (click)="resetFilter()">بازنشانی</button>
    </footer>
  </form>

  <ag-grid-angular [enableRtl]="true"
                   [getRowId]="getRowId"
                   [style.width]="width"
                   [style.height]="height"
                   [localeText]="localeText"
                   [rowModelType]="rowModelType"
                   [autoSizeStrategy]="autoSizeStrategy"
                   [loadingOverlayComponent]="loadingOverlayComponent"
                   [paginationPageSizeSelector]="paginationPageSizeSelector"
                   (gridReady)="onGridReady($event)">
  </ag-grid-angular>

</fd-page-wrapper>
