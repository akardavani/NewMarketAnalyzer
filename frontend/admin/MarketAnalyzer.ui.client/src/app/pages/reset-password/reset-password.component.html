<form [formGroup]="formGroup" class="form" (ngSubmit)="submit()">
  <div class="d-flex align-items-stretch">
    <div class="form-container">

      <header>
        <h3 class="fw-bold text-primary-emphasis">بازنشانی رمز عبور</h3>

        @if (brand.logoUrl) {
        <img class="broker-logo" [src]="brand.logoUrl" alt="" />
        } @else {
        <div class="broker-logo"></div>
        }
        <div class="d-flex flex-column align-items-center">
          <h5>{{ brand.productFullName }}</h5>
          @if (brand.managerName) {
          <h6>{{ brand.managerName }}</h6>
          }
        </div>
      </header>

      <div class="d-grid flex-column gap-4">
        <div>
          <fd-float-label placeholder="نام کاربری / شماره تلفن">
            <input type="text" class="form-control" formControlName="userName" />
          </fd-float-label>
          <span class="input-error-text" errorFor="userName"></span>
        </div>

        <div>
          <fd-float-label placeholder="رمز عبور جدید">
            <fd-password formControlName="password"></fd-password>
          </fd-float-label>
          <span class="input-error-text" errorFor="password"></span>
        </div>

        <div>
          <fd-float-label placeholder="تکرار رمز عبور">
            <fd-password formControlName="confirmPassword"></fd-password>
          </fd-float-label>
          <span class="input-error-text" errorFor="confirmPassword"></span>
        </div>

        <div>
          <fd-float-label placeholder="کد اعتبارسنجی">
            <input type="text" class="form-control" formControlName="verificationCode" />
          </fd-float-label>
          <span class="input-error-text" errorFor="verificationCode"></span>
        </div>

        <div>
          <fd-float-label placeholder="کد امنیتی">
            <fd-captcha formControlName="captchaCode"></fd-captcha>
          </fd-float-label>
          <span class="input-error-text" errorFor="captchaCode"></span>
        </div>

        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-primary">ارسال</button>
          <a class="btn btn-success" routerLink="/login">بازگشت به صفحه ورود</a>
        </div>
      </div>

      <footer>
        @if(companyLogo) {
        <div class="company-logo"></div>
        }

        <div class="copyright">
          @if (brand.companyName) {
          <span class="pb-1">طراحی شده توسط: شرکت {{ brand.companyName }}</span>
          }
          <span>نسخه: {{version}}</span>
        </div>
      </footer>

    </div>
  </div>

</form>
