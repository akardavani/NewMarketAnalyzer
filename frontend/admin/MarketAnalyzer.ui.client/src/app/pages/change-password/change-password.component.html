<form class="dialog-warpper voucher-form" [formGroup]="formGroup" (ngSubmit)="submit()">
  <div class="dialog-header">
    <div class="dialog-title">تغییر رمز عبور</div>

    <div class="btn-close" (click)="close()">
      <i class="pa-close"></i>
    </div>
  </div>

  <div class="dialog-body d-flex flex-column gap-4 p-4">

    <div>
      <fd-float-label placeholder="کد اعتبارسنجی">
        <input type="text" class="form-control" formControlName="verificationCode" maxlength="12" />

        <div class="otp">
          <button type="button" class="btn btn-success" [disabled]="disableOtpRequest" (click)="requestOtp()">
            {{ disableOtpRequest  ? timer : 'درخواست کد اعتبارسنجی' }}
          </button>
        </div>
      </fd-float-label>
      <span class="input-error-text" errorFor="verificationCode"></span>
    </div>

    <div>
      <fd-float-label placeholder="رمز عبور فعلی">
        <fd-password formControlName="oldPassword"></fd-password>
      </fd-float-label>
      <span class="input-error-text" errorFor="oldPassword"></span>
    </div>

    <div>
      <fd-float-label placeholder="رمز عبور جدید">
        <fd-password formControlName="newPassword"></fd-password>
      </fd-float-label>
      <span class="input-error-text" errorFor="newPassword"></span>
    </div>

    <div>
      <fd-float-label placeholder="تکرار رمز عبور جدید">
        <fd-password formControlName="confirmNewPassword"></fd-password>
      </fd-float-label>
      <span class="input-error-text" errorFor="confirmNewPassword"></span>
    </div>

  </div>

  <div class="dialog-footer">
    <div class="d-inline-flex gap-2">
      <button type="submit" class="btn btn-primary">ذخیره</button>
      <button type="button" class="btn btn-dark" (click)="reset()">بازنشانی</button>
    </div>
  </div>
</form>
