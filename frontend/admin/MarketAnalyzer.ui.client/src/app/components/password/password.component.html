
<input [type]="_passwordType"
       class="form-control"
       floatLabelInput
       inputValidation
       [disabled]="disabled"
       [value]="_value"
       (blur)="_onBlur()"
       (input)="_onInput($event)" />

@if(showStrength) {
<div class="strength-label" [class]="_strengthColor()">{{_strengthLabel()}}</div>
}

<div class="btn-icon-group">
  <button type="button" tabindex="-1" class="btn btn-icon" (click)="togglePasswordType()">
    <i [class]="_passwordType == 'text' ? 'pa-eyes-close' : 'pa-eyes'"></i>
  </button>
  <button type="button" tabindex="-1" class="btn btn-icon" (click)="toogleKeyboard()">
    <i class="pa pa-keyboard"></i>
  </button>
</div>

<div #keyboard class="keyboard" [class.active]="_showKeyboard">
  <div class="simple-keyboard"></div>
</div>
