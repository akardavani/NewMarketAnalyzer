<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>PouyaFundUiClient</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script type="text/javascript" src="/env.js"></script>
  <script>
    // اعمال تم ثابت پیش از اولین رنگ‌آمیزی تا با ThemeService یکسان بماند.
    (function () {
      var d = document.documentElement;
      d.dataset.mode = 'light';
      d.dataset.palette = 'blue';
      d.dataset.density = 'compact';
      d.dataset.typeface = 'iransans';
      d.dataset.submit = 'theme';
      d.setAttribute('data-bs-theme', 'light');
    })();
  </script>
</head>
<body class="rtl">
  <fd-root></fd-root>
  <div class="app-loader-wrapper">
    <div class="loading-state" role="status" aria-live="polite" aria-busy="true">
      <div class="loader-mark" aria-hidden="true">
        <span class="loader-ring"></span>
        <span class="loader-core"><i class="pa pa-statistics"></i></span>
      </div>
      <div class="loading-copy">
        <span class="loading-kicker">Market Analyzer</span>
        <span class="waiting-msg">لطفا منتظر باشید...</span>
        <span class="loading-dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
    </div>
  </div>
  
</body>
</html>
